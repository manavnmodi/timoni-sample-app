name: Review Gate

on:
  push:
    branches: [prod]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Committer and Changed Files
        id: check
        run: |
          COMMITTER_EMAIL=$(git log -1 --format='%ae')
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)

          echo "Committer Email : $COMMITTER_EMAIL"
          echo "Changed Files   : $CHANGED_FILES"

          IS_BOT=false
          ONLY_IMAGE_CUE=false

          # Check if bot
          if [[ "$COMMITTER_EMAIL" == "github-actions[bot]@users.noreply.github.com" ]]; then
            IS_BOT=true
          fi

          # Check if only image.cue changed
          if [[ "$CHANGED_FILES" == "image.cue" ]]; then
            ONLY_IMAGE_CUE=true
          fi

          echo "is_bot=$IS_BOT"
          echo "only_image_cue=$ONLY_IMAGE_CUE"

          # Final decision
          if [[ "$IS_BOT" == "true" && "$ONLY_IMAGE_CUE" == "true" ]]; then
            echo "action=skip" >> $GITHUB_OUTPUT
          else
            echo "action=pr" >> $GITHUB_OUTPUT
          fi

      # ✅ Bot + only image.cue → Skip
      - name: Skip
        if: steps.check.outputs.action == 'skip'
        run: |
          echo "✅ Bot changed only image.cue — skipping."
          echo "🔁 ArgoCD webhook will handle the Timoni build."

      # 🔀 Anything else → Create PR
      - name: Create Pull Request
        if: steps.check.outputs.action == 'pr'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: review/${{ github.sha }}
          base: prod
          title: "Review Required: Changes by ${{ github.actor }}"
          body: "Non-bot commit or non-image.cue file changed. Please review before merge."
          reviewers: manavnmodi111
