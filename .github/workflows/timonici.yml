name: Review Gate

on:
  pull_request:
    branches: [prod]
    types: [opened, synchronize, reopened]

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      # Classify PR
      - name: Classify PR
        id: classify
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
      
          FILES_JSON=$(curl -s \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/files")
      
          FILE_COUNT=$(echo "$FILES_JSON" | jq 'length')
          FILE=$(echo "$FILES_JSON" | jq -r '.[0].filename // ""')
      
          echo "Author: $PR_AUTHOR"
          echo "File count: $FILE_COUNT"
          echo "File: $FILE"
      
          # Strict bot check
          if [[ "$PR_AUTHOR" == "timoni-github-app[bot]" && "$FILE_COUNT" == "1" && "$FILE" == "image.cue" ]]; then
            
            # OPTIONAL: Validate content (extra security)
            curl -s \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/files" \
              | jq -r '.[0].patch' | grep "digest:" || exit 1
      
            echo "auto=true" >> $GITHUB_OUTPUT
          else
            echo "auto=false" >> $GITHUB_OUTPUT
          fi
      
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      # Block invalid PR
      - name: Block PR
        if: steps.classify.outputs.auto == 'false'
        run: |
          echo "Manual review required"
          exit 1

      #  Auto merge valid PR
      - name: Enable Auto Merge
        if: steps.classify.outputs.auto == 'true'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.classify.outputs.pr_number }}
