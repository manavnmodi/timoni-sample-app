name: Review Gate

on:
  pull_request:
    branches: [prod]
    types: [opened, synchronize, reopened]

jobs:
  review-gate:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      # Classify PR
      - name: Classify PR
        id: classify
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"

          FILES_JSON=$(curl -s \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/files")

          FILE_COUNT=$(echo "$FILES_JSON" | jq 'length')
          ONLY_FILE=$(echo "$FILES_JSON" | jq -r '.[0].filename // ""')

          IS_BOT=false
          ONLY_IMAGE_CUE=false

          [[ "$PR_AUTHOR" == *"[bot]"* ]] && IS_BOT=true
          [[ "$FILE_COUNT" == "1" && "$ONLY_FILE" == "image.cue" ]] && ONLY_IMAGE_CUE=true

          if [[ "$IS_BOT" == "true" && "$ONLY_IMAGE_CUE" == "true" ]]; then
            echo "action=auto_merge" >> $GITHUB_OUTPUT
          else
            echo "action=require_review" >> $GITHUB_OUTPUT
          fi

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      # Generate token for reviewer app
      - name: Generate Reviewer App Token
        id: reviewer-token
        if: steps.classify.outputs.action == 'auto_merge'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Approve PR using SECOND APP
      - name: Auto Approve PR
        if: steps.classify.outputs.action == 'auto_merge'
        run: |
          echo "Approving PR with reviewer app..."
      
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ steps.reviewer-token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.classify.outputs.pr_number }}/reviews \
            -d '{"event":"APPROVE"}')
          echo "$RESPONSE"

      # Enable auto merge
      - name: Enable Auto Merge
        if: steps.classify.outputs.action == 'auto_merge'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.classify.outputs.pr_number }}
