name: Review Gate

on:
  pull_request:
    branches: ["prod"]
    # types: [opened]

jobs:
  review-gate:
    name: Validate and Auto-Merge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Classify PR changes
        id: classify
        uses: actions/github-script@v8
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const prAuthor = context.payload.pull_request.user.login;
            const changedFiles = files.map(f => f.filename);
            
            const isBot = prAuthor === 'timoni-github-app[bot]';
            const onlyImageCue = changedFiles.length === 1 && changedFiles[0] === 'image.cue';

            if (isBot && onlyImageCue) {
              core.setOutput('auto', 'true');
            } else {
              core.setOutput('auto', 'false');
            }

      # NEW: Generate the token for the app that has bypass permissions
      - name: Generate GitHub App Token
        if: steps.classify.outputs.auto == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TIMONI_APP_ID }}
          private-key: ${{ secrets.TIMONI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # NEW: Merge using the App Token and the --admin bypass flag
      - name: Force Merge (Bypass CODEOWNERS)
        if: steps.classify.outputs.auto == 'true'
        env:
          # Use the App token, NOT the default GITHUB_TOKEN
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # The --admin flag tells GitHub to use the bypass privileges
          gh pr merge "$PR_URL" --squash --admin

      - name: Block Manual PR
        if: steps.classify.outputs.auto == 'false'
        run: |
          echo "::error::This PR contains manual changes or is not from the authorized bot."
          echo "Manual Code Owner review is required before merging."
          exit 1
